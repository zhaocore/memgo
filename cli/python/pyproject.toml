[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgo-cli"
version = "0.2.12"
description = "The official CLI for memgo — the memory layer for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "memgo.ai", email = "founders@memgo.ai" },
]
keywords = ["memgo", "memory", "ai", "agents", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.16.0",
    "mypy>=1.19",
    "build>=1.3",
]

[project.scripts]
memgo = "memgo_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memgo_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/memgo_cli", "tests", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "D",    # 标准文档字符串
    "E",    # 基础风格错误
    "F",    # 未定义名称与无效导入
    "I",    # 导入排序
    "W",    # 基础风格告警
    "UP",   # 现代 Python 语法
    "B",    # 常见逻辑错误
    "SIM",  # 简化表达式
    "RUF",  # Ruff 扩展规则
]
ignore = [
    "D415",   # Ruff 不识别中文句号，中文文档检查负责校验
    "D417",   # 类型标注已说明简单参数，复杂约束在文档中补充
    "E501",   # 行长交给格式化工具
    "B008",   # Typer 声明式选项需要默认调用
    "SIM108", # 条件表达式按可读性选择
    "RUF001", # 中文全角标点属于合法文案
    "RUF002", # 中文文档允许全角标点
    "RUF003", # 中文注释允许全角标点
]

[tool.ruff.lint.isort]
known-first-party = ["memgo_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/memgo_cli"]
